
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="snow-container" id="snow"></div>

    <header>
        <h1>Skorik <span> Meter</span></h1>
        <p>A Snow Day Meter .</p>
    </header>

    <main>
        <section class="meter-card">
            <p class="eyebrow">SNOW DAY PROBABILITY</p>

            <div class="gauge" id="gauge">
                <div class="gauge-inner">
                    <h2 id="percentage">--%</h2>
                    <p id="status">Calculating...</p>
                </div>
            </div>

            <p class="location"> Newmarket, Ontario</p>
            <p class="disclaimer">    </p>
        </section>

        <section class="weather-card">
            <h2>Weather Conditions</h2>

            <div class="weather-grid">
                <div class="weather-item">
                    <span></span>
                    <h3 id="snowfall">-- cm</h3>
                    <p>Snowfall</p>
                </div>

                <div class="weather-item">
                    <span></span>
                    <h3 id="temperature">--°C</h3>
                    <p>Temperature</p>
                </div>

                <div class="weather-item">
                    <span></span>
                    <h3 id="wind">-- km/h</h3>
                    <p>Wind Speed</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
         v0.1
    </footer>

    <script src="/static/js/script.js"></script>
</body>
</html>
